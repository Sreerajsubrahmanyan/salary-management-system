databases:
  - name: salary-management-db
    region: singapore
    plan: free
    databaseName: salary_management_production
    user: salary_management

services:
  - type: web
    name: salary-management-api
    runtime: ruby
    rootDir: backend
    region: singapore
    plan: free
    buildCommand: bundle install
    startCommand: bundle exec rails db:prepare && bundle exec rails render:bootstrap && bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_MAX_THREADS
        value: "3"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: salary-management-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RENDER_HR_EMAIL
        sync: false
      - key: RENDER_HR_PASSWORD
        sync: false
      - key: RENDER_DEMO_HR_EMAIL
        sync: false
      - key: RENDER_DEMO_HR_PASSWORD
        sync: false

  - type: web
    name: salary-management-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://salary-management-api-x3bt.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
